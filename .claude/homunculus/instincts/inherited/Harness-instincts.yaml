# Harness Workflow Sticky Sidebar And Scroll Behavior Fix

## Action

Follow the sticky-sidebar-and-scroll-behavior-fix workflow:
1. Identify root cause of sticky/scroll issue (e.g., overflow-x, scroll container).
2. Update global.css (and sometimes nav.css or docs.css) to adjust overflow, positioning, or height.
3. Update or add JS handlers in docs-sidebar.js for scroll-spy or click behavior.
4. Test sidebar on docs.html and related pages.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: website/css/global.css, website/css/docs.css, website/js/docs-sidebar.js

