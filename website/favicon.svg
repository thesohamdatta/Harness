<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft drop shadow for the whole pendant -->
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.15" flood-color="#000000"/>
  </filter>

  <!-- Mint Green Pendant Body -->
  <circle cx="256" cy="256" r="230" fill="url(#pendant-gradient)" filter="url(#shadow)"/>
  
  <!-- Subtle inner glow to simulate rounded edge -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="white" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Camera Module Border (Dark Grey Ring) -->
  <circle cx="256" cy="135" r="54" fill="#0d0d0f"/>
  
  <!-- Camera Module Inner Ring -->
  <circle cx="256" cy="135" r="48" fill="url(#camera-housing)"/>
  
  <!-- Actual Glass Lens -->
  <circle cx="256" cy="135" r="32" fill="#020202"/>
  
  <!-- Lens Inner Elements -->
  <circle cx="256" cy="135" r="14" fill="#121214"/>
  <circle cx="256" cy="135" r="7" fill="#000000"/>
  
  <!-- Lens Reflections -->
  <path d="M 230 120 C 240 105, 272 105, 282 120" stroke="url(#glass-reflection)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="259" cy="130" r="2.5" fill="white" fill-opacity="0.8"/>
  <circle cx="250" cy="139" r="1.5" fill="white" fill-opacity="0.5"/>

  <!-- Top highlight for the pendant dome -->
  <ellipse cx="256" cy="50" rx="140" ry="30" fill="url(#top-highlight)"/>

  <defs>
    <!-- 3D Mint Green Gradient matching the image -->
    <radialGradient id="pendant-gradient" cx="40%" cy="30%" r="70%" fx="35%" fy="30%">
      <stop offset="0%" stop-color="#b8f5e7"/>
      <stop offset="40%" stop-color="#95e0ce"/>
      <stop offset="85%" stop-color="#6bc2ae"/>
      <stop offset="100%" stop-color="#55b09d"/>
    </radialGradient>
    
    <!-- Camera Housing Metallic Gradient -->
    <linearGradient id="camera-housing" x1="256" y1="81" x2="256" y2="189" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="50%" stop-color="#111112"/>
      <stop offset="100%" stop-color="#222224"/>
    </linearGradient>

    <!-- Glass Reflection Curved Arc -->
    <linearGradient id="glass-reflection" x1="230" y1="120" x2="282" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Top Highlight Gradient for 3D Dome Effect -->
    <linearGradient id="top-highlight" x1="256" y1="20" x2="256" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>