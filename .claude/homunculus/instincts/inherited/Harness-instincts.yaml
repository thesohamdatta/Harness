# Harness Workflow Css Design Token Refactor

## Action

Follow the css-design-token-refactor workflow:
1. Identify hardcoded CSS values in files like nav.css, global.css, index.css, style.css.
2. Replace hardcoded colors, font sizes, and other properties with CSS custom properties (design tokens).
3. Update HTML files (e.g., manifesto.html, index.html) if necessary to match new tokenized styles.
4. Test for visual consistency and accessibility.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: website/css/global.css, website/css/index.css, website/css/nav.css

